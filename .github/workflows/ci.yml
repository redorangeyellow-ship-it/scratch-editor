name: CI

on:
  merge_group:
  pull_request:
  push: 
  workflow_call:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.compare || github.head_ref || github.ref }}"
  cancel-in-progress: true
  
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      any-workspace: ${{ steps.filter.outputs.any-workspace }}
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4 

      - name: Checkout Custom Scratch Blocks
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scratch-blocks
          path: scratch-blocks-src

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Get blocks hash
        id: blocks-hash
        run: |
          echo "hash=${{ hashFiles('scratch-blocks-src/**') }}" >> $GITHUB_OUTPUT

      - name: Cache Scratch Blocks Dist
        id: cache-blocks
        uses: actions/cache@v4
        with:
          path: |
            scratch-blocks-src/dist
            scratch-blocks-src/*_compressed.js
            scratch-blocks-src/*_compressed_vertical.js
            scratch-blocks-src/msg/js/*.js
          key: ${{ runner.os }}-blocks-${{ steps.blocks-hash.outputs.hash }}

      - name: Build Scratch Blocks
        if: steps.cache-blocks.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          HUSKY: 0
        run: |
          cd scratch-blocks-src
          npm install
          npm run prepublish

      - name: Verify Blocks Build
        run: |
          echo "Checking for compiled files in scratch-blocks-src..."
          ls -lh scratch-blocks-src/blockly_compressed_vertical.js || echo "MISSING VERTICAL"
          ls -lh scratch-blocks-src/blocks_compressed_vertical.js || echo "MISSING BLOCKS"

      - name: Register Scratch Blocks Link
        env:
          HUSKY: 0
        run: |
          cd scratch-blocks-src
          npm link --ignore-scripts 

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ./.github/path-filters.yml

      - if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        uses: ./.github/actions/install-dependencies
        env:
          HUSKY: 0

      - name: Inject Custom Blocks
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        run: |
          rm -rf node_modules/scratch-blocks
          npm link scratch-blocks --ignore-scripts
          ls -ld node_modules/scratch-blocks

      - name: Build packages
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Store build artifacts
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/**/build
            packages/**/dist
            packages/**/playground

  preview:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ (needs.build.outputs.any-workspace == 'true') && ((!github.event.pull_request) || (github.event.pull_request.head.repo.full_name == github.repository)) && (!startsWith((github.head_ref || github.ref_name), 'renovate/')) }}
    name: Publish preview playgrounds
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine GitHub Pages directory name
        id: branch_dir_name
        run: echo "result=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" | tee --append "$GITHUB_OUTPUT"
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: packages
      
      - name: Prepare playgrounds
        run: |
          # 1. Create a staging directory inside the workspace
          mkdir -p final-pages-deploy
          
          # 2. Copy scratch-gui build contents to the root of our staging folder
          if [ -d "packages/scratch-gui/build" ]; then
            cp -r packages/scratch-gui/build/* final-pages-deploy/
          else
            echo "Warning: scratch-gui build not found!"
          fi
          
          # 3. Copy other playgrounds as subdirectories
          # for pkg_path in packages/*; do
          #   pkg_name=$(basename "$pkg_path")
          #   if [ -d "${pkg_path}/playground" ] && [ "$pkg_name" != "scratch-gui" ]; then
          #     cp -r "${pkg_path}/playground" "final-pages-deploy/${pkg_name}"
          #   fi
          # done
          
      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: final-pages-deploy
          branch: new-gh-pages
          clean: true
          git-config-name: github-actions[bot]
          git-config-email: 41898282+github-actions[bot]@users.noreply.github.com
          commit-message: "Deploy: ${{ env.SHORT_SHA }}"
  results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: build 
    if: ${{ !cancelled() }}
    steps:
      - run: exit 0
