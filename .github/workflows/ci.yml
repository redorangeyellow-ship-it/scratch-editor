name: CI

on:
  merge_group:
  pull_request:
  push: 
  workflow_call:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.compare || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      any-workspace: ${{ steps.filter.outputs.any-workspace }}
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4 

      - name: Checkout Custom Scratch Blocks
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scratch-blocks
          path: scratch-blocks-src

      - uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Get blocks hash
        id: blocks-hash
        run: |
          echo "hash=${{ hashFiles('scratch-blocks-src/**') }}" >> $GITHUB_OUTPUT

      - name: Cache Scratch Blocks Dist
        id: cache-blocks
        uses: actions/cache@v4
        with:
          path: |
            scratch-blocks-src/dist
            scratch-blocks-src/*_compressed.js
            scratch-blocks-src/*_compressed_vertical.js
            scratch-blocks-src/msg/js/*.js
          key: ${{ runner.os }}-blocks-${{ steps.blocks-hash.outputs.hash }}

      - name: Build Scratch Blocks
        if: steps.cache-blocks.outputs.cache-hit != 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          HUSKY: 0
        run: |
          cd scratch-blocks-src
          npm install
          npm run prepublish

      - name: Verify Blocks Build
        run: |
          echo "Checking for compiled files in scratch-blocks-src..."
          ls -lh scratch-blocks-src/blockly_compressed_vertical.js || echo "MISSING VERTICAL"
          ls -lh scratch-blocks-src/blocks_compressed_vertical.js || echo "MISSING BLOCKS"

      - name: Register Scratch Blocks Link
        env:
          HUSKY: 0
        run: |
          cd scratch-blocks-src
          npm link --ignore-scripts 

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: ./.github/path-filters.yml

      - if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        uses: ./.github/actions/install-dependencies
        env:
          HUSKY: 0

      - name: Inject Custom Blocks
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        run: |
          # Use 'npm link' by name. This points to the global registration we did in Step 6.
          # We force remove the existing folder first to ensure the symlink takes priority.
          rm -rf node_modules/scratch-blocks
          npm link scratch-blocks --ignore-scripts
          
          # Verify the link is healthy and points to our src folder
          ls -ld node_modules/scratch-blocks

      - name: Build packages
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build

      - name: Store build artifacts
        if: ${{ steps.filter.outputs.any-workspace == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            packages/**/build
            packages/**/dist
            packages/**/playground

  preview:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ (needs.build.outputs.any-workspace == 'true') && ((!github.event.pull_request) || (github.event.pull_request.head.repo.full_name == github.repository)) && (!startsWith((github.head_ref || github.ref_name), 'renovate/')) }}
    name: Publish preview playgrounds
    steps:
      - name: Determine GitHub Pages directory name
        id: branch_dir_name
        run: echo "result=${GITHUB_REF_NAME//[^A-Za-z0-9._-]/_}" | tee --append "$GITHUB_OUTPUT"
      
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: packages
      
      - name: Prepare playgrounds
        working-directory: ./packages
        run: |
          mkdir -p ../pages/
          # Copy scratch-gui build contents to the root of pages/ so it lives at /editor/
          cp -r scratch-gui/build/* ../pages/
          
          # Maintain other playgrounds as subdirectories if needed
          for pkg in *; do
            if [ -d "${pkg}/playground" ] && [ "${pkg}" != "scratch-gui" ]; then
              ln -s "../packages/${pkg}/playground" "../pages/${pkg}"
            fi
          done
            
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          destination_dir: "editor"

  results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: build 
    if: ${{ !cancelled() }}
    steps:
      - run: exit 0
